name: Test, Build & Deploy — Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f index.html && echo "✅ index.html OK" || (echo "❌ missing!" && exit 1)
          test -f style.css  && echo "✅ style.css OK"  || echo "⚠️ not found"
          test -f script.js  && echo "✅ script.js OK"  || echo "⚠️ not found"
      - name: Validate HTML
        run: |
          sudo apt-get install -y tidy -q
          tidy -errors -quiet -utf8 index.html && echo "✅ HTML valid" || echo "⚠️ warnings"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p dist
          cp index.html dist/
          [ -f style.css ] && cp style.css dist/ || true
          [ -f script.js ] && cp script.js dist/ || true
          [ -d images ]    && cp -r images dist/ || true
          [ -d assets ]    && cp -r assets dist/ || true
          ls -lah dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
